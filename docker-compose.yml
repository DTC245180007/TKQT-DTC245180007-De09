services:
  db:
    image: mysql:8.0
    container_name: ecommerce_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: RootSecurePass@2026
      MYSQL_DATABASE: ecommerce_db
      MYSQL_USER: ecommerce_user
      MYSQL_PASSWORD: SecurePass@2026
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend_net

  web:
    build: ./app
    container_name: ecommerce_app
    restart: always
    environment:
      DB_HOST: db
      DB_USER: ecommerce_user
      DB_PASSWORD: SecurePass@2026
      DB_NAME: ecommerce_db
    depends_on:
      - db
    networks:
      - frontend_net
      - backend_net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: ecommerce_pma
    restart: always
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ABSOLUTE_URI: https://192.168.245.130/phpmyadmin/
      UPLOAD_LIMIT: 64M
    depends_on:
      - db
    networks:
      - backend_net
      - frontend_net

  nginx:
    image: nginx:alpine
    container_name: ecommerce_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
      - phpmyadmin
    networks:
      - frontend_net

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge

volumes:
  db_data:
