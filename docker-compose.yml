services:
  # 1. Cơ sở dữ liệu MySQL
  db:
    image: mysql:8.0
    container_name: ecommerce_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: RootSecurePass@2026
      MYSQL_DATABASE: ecommerce_db
      MYSQL_USER: ecommerce_user
      MYSQL_PASSWORD: SecurePass@2026
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend_net

  # 2. Ứng dụng Node.js E-Commerce
  web:
    build: ./app
    container_name: ecommerce_app
    restart: always
    environment:
      DB_HOST: db
      DB_USER: ecommerce_user
      DB_PASSWORD: SecurePass@2026
      DB_NAME: ecommerce_db
    depends_on:
      - db
    networks:
      - frontend_net
      - backend_net

  # 3. Quản trị phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: ecommerce_pma
    restart: always
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ABSOLUTE_URI: https://192.168.245.130/phpmyadmin/
      UPLOAD_LIMIT: 64M
    depends_on:
      - db
    networks:
      - backend_net
      - frontend_net

  # 4. Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: ecommerce_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
      - phpmyadmin
    networks:
      - frontend_net

  # 5. cAdvisor giám sát Containers
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: ecommerce_cadvisor
    restart: always
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - backend_net

  # 6. Node Exporter giám sát tài nguyên Server (CPU, RAM, Disk)
  node-exporter:
    image: prom/node-exporter:latest
    container_name: ecommerce_node_exporter
    restart: always
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
    networks:
      - backend_net

  # 7. MySQL Exporter giám sát Database
  mysql-exporter:
    image: prom/mysqld-exporter:latest
    container_name: ecommerce_mysql_exporter
    restart: always
    volumes:
      - ./mysql-exporter/.my.cnf:/.my.cnf:ro
    command:
      - "--config.my-cnf=/.my.cnf"
    depends_on:
      - db
    networks:
      - backend_net

  # 8. Prometheus thu thập Metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: ecommerce_prometheus
    restart: always
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - cadvisor
      - node-exporter
      - mysql-exporter
    networks:
      - backend_net
      - frontend_net

  # 9. Grafana hiển thị Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: ecommerce_grafana
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - frontend_net

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge

volumes:
  db_data:
  prometheus_data:
  grafana_data:
