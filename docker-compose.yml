services:
  # 1. Database MySQL (Hardening: Mật khẩu mạnh, nằm trong backend_net)
  db:
    image: mysql:8.0
    container_name: ecommerce_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: RootSecurePass@2026
      MYSQL_DATABASE: ecommerce_db
      MYSQL_USER: ecommerce_user
      MYSQL_PASSWORD: SecurePass@2026
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend_net

  # 2. Web App Node.js (Hardening: User Non-root 'node')
  web:
    build: ./app
    container_name: ecommerce_app
    restart: always
    environment:
      DB_HOST: db
      DB_USER: ecommerce_user
      DB_PASSWORD: SecurePass@2026
      DB_NAME: ecommerce_db
    depends_on:
      - db
    networks:
      - frontend_net
      - backend_net

  # 3. Quản trị phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: ecommerce_pma
    restart: always
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ABSOLUTE_URI: https://192.168.245.130/phpmyadmin/
      UPLOAD_LIMIT: 64M
    depends_on:
      - db
    networks:
      - backend_net
      - frontend_net

  # 4. Nginx Reverse Proxy (Hardening: HTTPS SSL, Security Headers, Ẩn version)
  nginx:
    image: nginx:alpine
    container_name: ecommerce_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
      - phpmyadmin
    networks:
      - frontend_net

  # 5. cAdvisor giám sát Containers
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: ecommerce_cadvisor
    restart: always
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - backend_net

  # 6. Node Exporter giám sát tài nguyên máy chủ
  node-exporter:
    image: prom/node-exporter:latest
    container_name: ecommerce_node_exporter
    restart: always
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
    networks:
      - backend_net

  # 7. MySQL Exporter giám sát Database
  mysql-exporter:
    image: prom/mysqld-exporter:latest
    container_name: ecommerce_mysql_exporter
    restart: always
    volumes:
      - ./mysql-exporter/.my.cnf:/.my.cnf:ro
    command:
      - "--config.my-cnf=/.my.cnf"
    depends_on:
      - db
    networks:
      - backend_net

  # 8. Prometheus thu thập Metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: ecommerce_prometheus
    restart: always
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - cadvisor
      - node-exporter
      - mysql-exporter
    networks:
      - backend_net
      - frontend_net

  # 9. Hệ thống lưu trữ Log Loki
  loki:
    image: grafana/loki:latest
    container_name: ecommerce_loki
    restart: always
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks:
      - backend_net
      - frontend_net

  # 10. Agent thu thập log Promtail
  promtail:
    image: grafana/promtail:latest
    container_name: ecommerce_promtail
    restart: always
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - backend_net
      - frontend_net

  # 11. Grafana trực quan hóa số liệu và log
  grafana:
    image: grafana/grafana:latest
    container_name: ecommerce_grafana
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - frontend_net

# Hardening: Network Isolation tách biệt mạng ngoại vi và mạng dữ liệu
networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge

volumes:
  db_data:
  prometheus_data:
  grafana_data:
  loki_data:
